name: Build Android
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Подключить нейросетевую озвучку (sherpa-onnx)
        id: sherpa
        continue-on-error: true
        run: |
          set -e
          TAG=$(curl -fsSL https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/latest | python3 -c "import sys,json;print(json.load(sys.stdin)['tag_name'])")
          echo "sherpa-onnx: $TAG"
          curl -fsSL -o sherpa.tar.bz2 "https://github.com/k2-fsa/sherpa-onnx/releases/download/$TAG/sherpa-onnx-$TAG-android.tar.bz2"
          mkdir sherpa && tar xjf sherpa.tar.bz2 -C sherpa
          SO=$(find sherpa -type d -name arm64-v8a | head -1)
          test -n "$SO"
          mkdir -p app/src/main/jniLibs
          cp -r "$SO" app/src/main/jniLibs/
          mkdir -p app/src/main/java/com/k2fsa/sherpa/onnx
          curl -fsSL -o app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt "https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/$TAG/sherpa-onnx/kotlin-api/Tts.kt"
          grep -q "class OfflineTts" app/src/main/java/com/k2fsa/sherpa/onnx/Tts.kt

      - name: Убрать нейроголоса, если не удалось подключить
        if: steps.sherpa.outcome == 'failure'
        run: |
          rm -f app/src/main/java/com/talk/translator/PiperImpl.kt
          rm -rf app/src/main/jniLibs app/src/main/java/com/k2fsa

      - name: Сборка
        id: build1
        continue-on-error: true
        run: gradle assembleDebug --no-daemon -PverCode=${{ github.run_number }}

      - name: Сборка без нейроголосов (запасной вариант)
        if: steps.build1.outcome == 'failure'
        run: |
          rm -f app/src/main/java/com/talk/translator/PiperImpl.kt
          rm -rf app/src/main/jniLibs app/src/main/java/com/k2fsa
          gradle assembleDebug --no-daemon -PverCode=${{ github.run_number }}

      - name: Переименовать APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TalkingTranslator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TalkingTranslator-Android
          path: TalkingTranslator.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Версия ${{ github.run_number }}
          make_latest: true
          files: TalkingTranslator.apk
